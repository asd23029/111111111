name: Taichung social restaurant discovery
on:
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"
permissions:
  contents: write
jobs:
  collect-public-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Crawl public indexed discussions only
        run: python taichung-birthday-swipe/scripts/collect_social.py
      - name: Publish source links and crawl status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add taichung-birthday-swipe/data/social_signals.json taichung-birthday-swipe/data/source_status.json
          if ! git diff --staged --quiet; then
            git commit -m "Update public Taichung restaurant discussion sources"
            git push
          fi
